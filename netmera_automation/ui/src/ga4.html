<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics Veri Çekme</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bd6'/%3E%3Cpath d='M10 22v-6M16 22V10M22 22v-9' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ---------- Belirteçler (ham → anlamsal). Tasarım kuralları: docs/arayuz-tasarimi.md ---------- */
:root {
  color-scheme: light;
  --bg: oklch(0.984 0.003 255);
  --surface: oklch(1 0 0);
  --surface-2: oklch(0.968 0.004 255);
  --surface-3: oklch(0.944 0.005 255);
  --kenar-bg: oklch(0.972 0.004 255);
  --line: oklch(0.918 0.005 255);
  --line-2: oklch(0.868 0.007 255);
  --text: oklch(0.21 0.012 262);
  --text-2: oklch(0.44 0.012 262);
  --text-3: oklch(0.57 0.012 262);
  --accent: oklch(0.54 0.2 268);
  --accent-2: oklch(0.49 0.21 268);
  --accent-soft: oklch(0.955 0.03 268);
  --accent-text: oklch(0.46 0.19 268);
  --btn-primary: oklch(0.54 0.2 268);
  --btn-primary-2: oklch(0.49 0.21 268);
  --on-accent: oklch(1 0 0);
  --ok: oklch(0.58 0.13 158); --ok-soft: oklch(0.962 0.035 158); --ok-text: oklch(0.42 0.11 158);
  --warn: oklch(0.72 0.15 75); --warn-soft: oklch(0.97 0.045 88); --warn-text: oklch(0.47 0.11 62);
  --err: oklch(0.58 0.2 27); --err-soft: oklch(0.965 0.022 27); --err-text: oklch(0.48 0.17 27);
  --mor-soft: oklch(0.955 0.035 305); --mor-text: oklch(0.47 0.15 305);
  --shadow-card: 0 0 0 1px var(--line), 0 1px 2px oklch(0.2 0.02 260 / 0.04);
  --shadow-pop: 0 0 0 1px var(--line), 0 18px 44px -14px oklch(0.2 0.03 260 / 0.24), 0 4px 12px -4px oklch(0.2 0.03 260 / 0.08);
  --ring: 0 0 0 3px oklch(0.54 0.2 268 / 0.26);
  --scrim: oklch(0.2 0.02 260 / 0.32);
  --font: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", "JetBrains Mono", Consolas, ui-monospace, monospace;
  --r: 8px; --r-lg: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="acik"]) { color-scheme: dark;
    --bg: oklch(0.155 0.006 265); --surface: oklch(0.19 0.007 265); --surface-2: oklch(0.225 0.008 265); --surface-3: oklch(0.26 0.009 265);
    --kenar-bg: oklch(0.17 0.006 265); --line: oklch(0.28 0.009 265); --line-2: oklch(0.35 0.01 265);
    --text: oklch(0.94 0.005 265); --text-2: oklch(0.75 0.008 265); --text-3: oklch(0.61 0.01 265);
    --accent: oklch(0.72 0.15 268); --accent-2: oklch(0.78 0.13 268); --accent-soft: oklch(0.3 0.07 268); --accent-text: oklch(0.8 0.12 268);
    --btn-primary: oklch(0.57 0.19 268); --btn-primary-2: oklch(0.62 0.18 268);
    --ok: oklch(0.72 0.14 158); --ok-soft: oklch(0.28 0.05 158); --ok-text: oklch(0.82 0.12 158);
    --warn: oklch(0.8 0.14 80); --warn-soft: oklch(0.3 0.05 80); --warn-text: oklch(0.87 0.12 85);
    --err: oklch(0.7 0.17 27); --err-soft: oklch(0.3 0.06 27); --err-text: oklch(0.82 0.12 27);
    --mor-soft: oklch(0.3 0.06 305); --mor-text: oklch(0.82 0.1 305);
    --shadow-card: 0 0 0 1px var(--line); --shadow-pop: 0 0 0 1px var(--line-2), 0 22px 50px -12px oklch(0 0 0 / 0.6);
    --ring: 0 0 0 3px oklch(0.72 0.15 268 / 0.35); --scrim: oklch(0 0 0 / 0.5); }
}
:root[data-tema="koyu"] { color-scheme: dark;
  --bg: oklch(0.155 0.006 265); --surface: oklch(0.19 0.007 265); --surface-2: oklch(0.225 0.008 265); --surface-3: oklch(0.26 0.009 265);
  --kenar-bg: oklch(0.17 0.006 265); --line: oklch(0.28 0.009 265); --line-2: oklch(0.35 0.01 265);
  --text: oklch(0.94 0.005 265); --text-2: oklch(0.75 0.008 265); --text-3: oklch(0.61 0.01 265);
  --accent: oklch(0.72 0.15 268); --accent-2: oklch(0.78 0.13 268); --accent-soft: oklch(0.3 0.07 268); --accent-text: oklch(0.8 0.12 268);
  --btn-primary: oklch(0.57 0.19 268); --btn-primary-2: oklch(0.62 0.18 268);
  --ok: oklch(0.72 0.14 158); --ok-soft: oklch(0.28 0.05 158); --ok-text: oklch(0.82 0.12 158);
  --warn: oklch(0.8 0.14 80); --warn-soft: oklch(0.3 0.05 80); --warn-text: oklch(0.87 0.12 85);
  --err: oklch(0.7 0.17 27); --err-soft: oklch(0.3 0.06 27); --err-text: oklch(0.82 0.12 27);
  --mor-soft: oklch(0.3 0.06 305); --mor-text: oklch(0.82 0.1 305);
  --shadow-card: 0 0 0 1px var(--line); --shadow-pop: 0 0 0 1px var(--line-2), 0 22px 50px -12px oklch(0 0 0 / 0.6);
  --ring: 0 0 0 3px oklch(0.72 0.15 268 / 0.35); --scrim: oklch(0 0 0 / 0.5); }

/* ---------- Temel ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); }
h1, h2, h3, h4 { margin: 0; letter-spacing: -0.011em; }
p { margin: 0; }
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.gizli-metin { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ikincil { color: var(--text-2); }
.soluk { color: var(--text-3); }
.kucuk { font-size: 12.5px; }
.sayi { text-align: right; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- Yerleşim ---------- */
.uygulama { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.kenar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 14px 10px;
  background: var(--kenar-bg); border-right: 1px solid var(--line); }
.marka { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; }
.marka-logo { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: white;
  background: linear-gradient(140deg, oklch(0.6 0.2 275), oklch(0.5 0.21 262)); box-shadow: 0 1px 2px oklch(0.3 0.1 268 / 0.35), inset 0 1px 0 oklch(1 0 0 / 0.2); }
.marka-ad { font-weight: 600; font-size: 13.5px; line-height: 1.2; }
.marka-surum { font-size: 11.5px; color: var(--text-3); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-baslik { font-size: 11.5px; color: var(--text-3); padding: 12px 10px 4px; font-weight: 500; }
.nav-oge { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: var(--r); color: var(--text-2);
  font-size: 13.5px; font-weight: 500; text-decoration: none; transition: background .12s, color .12s; }
.nav-oge:hover { background: var(--surface-3); color: var(--text); text-decoration: none; }
.nav-oge[aria-current="page"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-card); }
.nav-oge[aria-current="page"] svg { color: var(--accent); }
.nav-oge .kbd { margin-left: auto; }
.kenar-alt { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 4px 0; }
.durum-hap { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--r); font-size: 12.5px; color: var(--text-2);
  background: var(--surface); box-shadow: var(--shadow-card); text-decoration: none; }
.durum-hap:hover { text-decoration: none; color: var(--text); }
.nokta { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--text-3); box-shadow: 0 0 0 3px oklch(0.6 0.01 260 / 0.15); }
.nokta.ok { background: var(--ok); box-shadow: 0 0 0 3px oklch(0.6 0.13 158 / 0.18); }
.nokta.uyari { background: var(--warn); box-shadow: 0 0 0 3px oklch(0.75 0.15 75 / 0.2); }
.nokta.hata { background: var(--err); box-shadow: 0 0 0 3px oklch(0.6 0.2 27 / 0.18); }
.kenar-satir { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 2px; }
.icerik { min-width: 0; outline: none; }
.sayfa { max-width: 1180px; margin: 0 auto; padding: 28px 36px 64px; animation: belir .18s ease-out; }
@keyframes belir { from { opacity: 0; transform: translateY(3px); } }
.sayfa-ust { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.sayfa-ust h1 { font-size: 22px; font-weight: 600; }
.sayfa-ust p { color: var(--text-2); margin-top: 4px; max-width: 640px; }
.eylemler { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- Bileşenler ---------- */
.kart { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-card); }
.kart-ic { padding: 18px 20px; }
.kart-ust { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.kart-baslik { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.izgara { display: grid; gap: 14px; }
.izgara-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.izgara-2 { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
.stat { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; min-height: 124px; }
.stat-etiket { display: flex; align-items: center; gap: 7px; color: var(--text-2); font-size: 12.5px; font-weight: 500; }
.stat-deger { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat-alt { color: var(--text-3); font-size: 12.5px; margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: var(--r);
  border: 0; background: var(--surface); color: var(--text); font-size: 13.5px; font-weight: 500; cursor: pointer; white-space: nowrap;
  box-shadow: 0 0 0 1px var(--line-2), 0 1px 1px oklch(0.2 0.02 260 / 0.04); transition: background .12s, box-shadow .12s, transform .06s; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(0.5px); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-ana { background: var(--btn-primary); color: var(--on-accent); box-shadow: 0 1px 2px oklch(0.3 0.12 268 / 0.3), inset 0 1px 0 oklch(1 0 0 / 0.14); }
.btn-ana:hover { background: var(--btn-primary-2); }
.btn-hayalet { background: transparent; box-shadow: none; color: var(--text-2); }
.btn-hayalet:hover { background: var(--surface-3); color: var(--text); }
.btn-tehlike { background: var(--err); color: white; box-shadow: none; }
.btn-tehlike:hover { background: oklch(0.52 0.2 27); }
.btn-kucuk { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn-genis { width: 100%; height: 36px; }
.btn .yukleniyor { width: 14px; height: 14px; }
.ikon-dugme { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; border: 0; background: transparent;
  color: var(--text-3); cursor: pointer; }
.ikon-dugme:hover { background: var(--surface-3); color: var(--text); }
.kbd { font-family: var(--font); font-size: 11px; color: var(--text-3); padding: 1px 5px; border-radius: 5px; background: var(--surface);
  box-shadow: 0 0 0 1px var(--line-2); line-height: 1.5; }
.yukleniyor { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent;
  animation: don .7s linear infinite; display: inline-block; flex: none; }
@keyframes don { to { transform: rotate(360deg); } }

.alan { display: flex; flex-direction: column; gap: 6px; }
.alan + .alan { margin-top: 16px; }
.etiket { font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ipucu { font-size: 12.5px; color: var(--text-3); }
.giris, select.giris, textarea.giris { width: 100%; height: 34px; padding: 0 10px; border-radius: var(--r); border: 0; background: var(--surface);
  box-shadow: 0 0 0 1px var(--line-2); transition: box-shadow .12s; }
textarea.giris { height: auto; min-height: 64px; padding: 8px 10px; resize: vertical; line-height: 1.45; }
.giris:hover { box-shadow: 0 0 0 1px var(--text-3); }
.giris:focus { outline: none; box-shadow: 0 0 0 1px var(--accent), var(--ring); }
.giris.mono { font-family: var(--mono); font-size: 13px; }
.giris-ikonlu { position: relative; }
.giris-ikonlu svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.giris-ikonlu .giris { padding-left: 32px; }

.api { font-family: var(--mono); font-size: 11.5px; padding: 1px 6px; border-radius: 5px; background: var(--surface-2); color: var(--text-2);
  box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; }
.rozet { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 999px; font-size: 11.5px; font-weight: 500;
  background: var(--surface-3); color: var(--text-2); white-space: nowrap; }
.rozet-ok { background: var(--ok-soft); color: var(--ok-text); }
.rozet-uyari { background: var(--warn-soft); color: var(--warn-text); }
.rozet-hata { background: var(--err-soft); color: var(--err-text); }
.rozet-vurgu { background: var(--accent-soft); color: var(--accent-text); }
.rozet-mor { background: var(--mor-soft); color: var(--mor-text); }
.cipler { display: flex; flex-wrap: wrap; gap: 4px; }

.uyari-kutu { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r); font-size: 13px; line-height: 1.45; }
.uyari-kutu svg { flex: none; margin-top: 1px; }
.uyari-kutu.bilgi { background: var(--accent-soft); color: var(--accent-text); }
.uyari-kutu.uyari { background: var(--warn-soft); color: var(--warn-text); }
.uyari-kutu.hata { background: var(--err-soft); color: var(--err-text); }
.uyari-kutu.ok { background: var(--ok-soft); color: var(--ok-text); }
.uyari-kutu ul { margin: 2px 0 0; padding-left: 18px; }

/* Bölümlü kontrol */
.segment { display: inline-flex; padding: 2px; gap: 2px; border-radius: 9px; background: var(--surface-3); }
.segment-oge { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border: 0; border-radius: 7px; background: transparent;
  color: var(--text-2); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.segment-oge:hover:not(:disabled) { color: var(--text); }
.segment-oge.secili { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px oklch(0.2 0.02 260 / 0.1), 0 0 0 1px var(--line); }
.segment-oge:disabled { opacity: .45; cursor: not-allowed; }

/* Anahtar (switch) */
.anahtar { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13.5px; }
.anahtar-giris { position: absolute; opacity: 0; width: 34px; height: 20px; margin: 0; cursor: pointer; }
.anahtar-iz { width: 34px; height: 20px; border-radius: 999px; background: var(--line-2); position: relative; transition: background .15s; flex: none; }
.anahtar-iz::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: white;
  box-shadow: 0 1px 2px oklch(0 0 0 / 0.25); transition: transform .15s; }
.anahtar-giris:checked + .anahtar-iz { background: var(--accent); }
.anahtar-giris:checked + .anahtar-iz::after { transform: translateX(14px); }
.anahtar-giris:focus-visible + .anahtar-iz { box-shadow: var(--ring); }
.anahtar.devre-disi { opacity: .5; cursor: not-allowed; }

/* Tablo */
.arac-cubugu { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.arac-cubugu .giris-ikonlu { width: 260px; }
.tablo-kap { overflow: auto; }
table.tablo { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
.tablo th { position: sticky; top: 0; z-index: 1; background: var(--surface); text-align: left; font-size: 12px; font-weight: 500; color: var(--text-3);
  padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tablo td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tablo tbody tr { transition: background .1s; }
.tablo tbody tr:hover { background: var(--surface-2); }
.tablo tbody tr:last-child td { border-bottom: 0; }
.tablo tr.tiklanir { cursor: pointer; }
.tablo .sayi { text-align: right; }
.tablo th.sayi { text-align: right; }
.is-ad { font-weight: 500; }
.is-alt { font-size: 12.5px; color: var(--text-3); margin-top: 1px; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kapali-satir td:not(:first-child) { opacity: .55; }
.tablo-alt { display: flex; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--line); color: var(--text-3); font-size: 12.5px; }

/* İskelet */
.iskelet { display: block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-3) 25%, var(--surface-2) 37%, var(--surface-3) 63%);
  background-size: 400% 100%; animation: parilti 1.3s ease infinite; }
@keyframes parilti { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

/* Boş durum */
.bos-durum { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 44px 24px 48px; }
.bos-durum h3 { font-size: 15px; font-weight: 600; margin-top: 6px; }
.bos-durum p { color: var(--text-2); max-width: 420px; }
.bos-durum .eylemler { margin-top: 10px; justify-content: center; }
.cizim-kart { fill: var(--surface); stroke: var(--line-2); }
.cizim-cizgi { fill: var(--surface-3); }
.cizim-vurgu { fill: var(--accent-soft); stroke: var(--accent); }

/* Birleşik seçim kutusu */
.cs { position: relative; }
.cs-alan { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; min-height: 36px; padding: 4px 6px; border-radius: var(--r); background: var(--surface);
  box-shadow: 0 0 0 1px var(--line-2); cursor: text; transition: box-shadow .12s; }
.cs-alan:focus-within { box-shadow: 0 0 0 1px var(--accent), var(--ring); }
.cs-cipler { display: contents; }
.cip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 4px 0 9px; border-radius: 6px; background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; max-width: 100%; }
.cip-api { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.cip-sil { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; border: 0; background: transparent; color: var(--text-3); cursor: pointer; }
.cip-sil:hover { background: var(--surface-3); color: var(--text); }
.cs-giris { flex: 1; min-width: 120px; height: 26px; border: 0; outline: none; background: transparent; padding: 0 4px; }
.cs-liste { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 6px); max-height: 300px; overflow: auto; padding: 4px;
  background: var(--surface); border-radius: 10px; box-shadow: var(--shadow-pop); }
.cs-grup { font-size: 11.5px; font-weight: 500; color: var(--text-3); padding: 8px 8px 4px; position: sticky; top: -4px; background: var(--surface); }
.cs-secenek { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 6px; cursor: pointer; font-size: 13.5px; }
.cs-secenek.aktif { background: var(--surface-3); }
.cs-tik { width: 16px; display: grid; place-items: center; color: var(--accent); flex: none; }
.cs-ad { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cs-api { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.cs-bos { padding: 14px; color: var(--text-3); font-size: 13px; text-align: center; }
.api.alan-ad { font-family: inherit; font-size: 12px; }

async function api(yontem, yol, govde) {
  // Etkin proje her isteğe eklenir (GET: ?proje=, POST: gövdede); istek kendi projesini verdiyse dokunulmaz
  if (D.proje) {
    if (yontem === 'GET') { if (!/[?&]proje=/.test(yol)) yol += (yol.includes('?') ? '&' : '?') + 'proje=' + encodeURIComponent(D.proje); }
    else if (!govde || !('proje' in govde)) govde = { ...(govde || {}), proje: D.proje };
  }
  let r;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), yontem === 'GET' ? 15000 : 600000);
  try {
    r = await fetch(yol, { signal: controller.signal, method: yontem, headers: { 'X-Token': TOKEN, ...(govde ? { 'Content-Type': 'application/json' } : {}) },
                           body: govde ? JSON.stringify(govde) : undefined });
  } catch (e) {
    clearTimeout(timer);
    if (e.name === 'AbortError') throw new Error('İstek süresi doldu. İşlem tamamlanmış olabilir; durumu yenileyin.');
    throw new Error('Uygulamaya ulaşılamadı: siyah pencere kapanmış olabilir. AnalyticsVeriCekme.cmd ile yeniden aç ve açılan yeni sekmeyi kullan.');
  }
  let veri = null;
  try { veri = await r.json(); }
  catch (e) { throw new Error(e.name === 'AbortError' ? 'İstek süresi doldu. Durumu yenileyin.' : 'Uygulamanın yanıtı okunamadı. Sayfayı yenileyin.'); }
  finally { clearTimeout(timer); }
  if (!r.ok) throw new Error((veri && veri.error) || `İstek başarısız (${r.status})`);
  return veri;
}

const OZELLIK = new Set(['value', 'checked', 'disabled', 'hidden', 'htmlFor', 'tabIndex', 'type', 'min', 'max', 'step', 'maxLength', 'multiple', 'accept', 'open']);
function h(etiket, oz, ...cocuklar) {
  const el = document.createElement(etiket);
  for (const [k, v] of Object.entries(oz || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (OZELLIK.has(k)) el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of cocuklar.flat(3)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

const nfYuzde = new Intl.NumberFormat('tr-TR', { style: 'percent', maximumFractionDigits: 1 });
const tarihBicim = new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
function sayiBicim(v, api, tur) {
  if (v == null || Number.isNaN(v)) return '—';
  if (/Rate$/.test(api) || tur === 'TYPE_PERCENT') return nfYuzde.format(v);
  if (tur === 'TYPE_SECONDS' || /Duration$/.test(api)) {
    const sn = Math.round(v), dk = Math.floor(sn / 60), sa = Math.floor(dk / 60);
    return sa ? `${sa} sa ${dk % 60} dk` : dk ? `${dk} dk ${sn % 60} sn` : `${sn} sn`;
  }
  if (tur === 'TYPE_CURRENCY' || /Revenue|Cost|AdSpend/.test(api)) return nfPara.format(v);
  return Number.isInteger(v) ? nf0.format(v) : nf2.format(v);
}
const gunYaz = s => { const d = new Date(s + 'T00:00:00'); return Number.isNaN(d.getTime()) ? s : tarihBicim.format(d); };
function aralikYaz([a, b]) { return a === b ? gunYaz(a) : `${gunYaz(a)} – ${gunYaz(b)}`; }
function onceYaz(iso) {
  const fark = (Date.now() - new Date(iso).getTime()) / 1000;
  if (!Number.isFinite(fark)) return '';
  if (fark < 60) return 'az önce';
  if (fark < 3600) return `${Math.floor(fark / 60)} dk önce`;
  if (fark < 86400) return `${Math.floor(fark / 3600)} sa önce`;
  return tarihBicim.format(new Date(iso));
}
const TARIH_TUR = { dun: 'Dün', bugun: 'Bugün', son_n_gun: 'Son N gün', son_n_hafta: 'Son N hafta', son_n_ay: 'Son N ay', son_n_yil: 'Son N yıl',
                    ay_basindan: 'Ay başından düne', yil_basindan: 'Yıl başından düne', aralik: 'Tarih aralığı' };
const TARIH_GRUP = [['Gün', ['dun', 'bugun', 'son_n_gun']], ['Tam dönemler', ['son_n_hafta', 'son_n_ay', 'son_n_yil']],
                    ['Dönem başından', ['ay_basindan', 'yil_basindan']], ['Özel', ['aralik']]];
const N_TUR = { son_n_gun: ['gün', 365, 7], son_n_hafta: ['hafta', 104, 4], son_n_ay: ['ay', 36, 3], son_n_yil: ['yıl', 10, 2] };  // birim, en çok, varsayılan
const ZAMAN_TUR = { '': 'Toplam', gun: 'Gün', hafta: 'Hafta', ay: 'Ay', yil: 'Yıl' };
const ZAMAN_BOYUT = { gun: 'date', hafta: 'isoYearIsoWeek', ay: 'yearMonth', yil: 'year' };
/* rapor.resolve_dates ile aynı kurallar (bilgisayarın takvimi); yalnız önizleme için */
function tarihCoz(t, simdi = new Date()) {
  const g = (y, m, d) => new Date(y, m, d), b = g(simdi.getFullYear(), simdi.getMonth(), simdi.getDate());
  const ekle = (d, n) => g(d.getFullYear(), d.getMonth(), d.getDate() + n), dun = ekle(b, -1), n = Number(t.n);
  switch (t.tur) {
    case 'dun': return [dun, dun];
    case 'bugun': return [b, b];
    case 'son_n_gun': return [ekle(b, -n), dun];
    case 'son_n_hafta': { const pzt = ekle(b, -((b.getDay() + 6) % 7)); return [ekle(pzt, -7 * n), ekle(pzt, -1)]; }
    case 'son_n_ay': return [g(b.getFullYear(), b.getMonth() - n, 1), g(b.getFullYear(), b.getMonth(), 0)];
    case 'son_n_yil': return [g(b.getFullYear() - n, 0, 1), g(b.getFullYear() - 1, 11, 31)];
    case 'ay_basindan': return [g(dun.getFullYear(), dun.getMonth(), 1), dun];
    case 'yil_basindan': return [g(dun.getFullYear(), 0, 1), dun];
    default: return null;
  }
}
const isoGun = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const ayBicim = new Intl.DateTimeFormat('tr-TR', { month: 'long', year: 'numeric' });
function boyutDeger(b, v) {
  v = String(v);
  if (b === 'date' && /^\d{8}$/.test(v)) return gunYaz(`${v.slice(0, 4)}-${v.slice(4, 6)}-${v.slice(6)}`);
  if (b === 'yearMonth' && /^\d{6}$/.test(v)) return ayBicim.format(new Date(+v.slice(0, 4), +v.slice(4) - 1, 1));
  if ((b === 'isoYearIsoWeek' || b === 'yearWeek') && /^\d{6}$/.test(v)) return `${v.slice(0, 4)} · ${+v.slice(4)}. hafta`;
  return v;
}
function tarihOzet(t) {
  if (N_TUR[t.tur]) return `Son ${t.n} ${N_TUR[t.tur][0]}`;
  if (t.tur === 'aralik') return `${gunYaz(t.baslangic)} – ${gunYaz(t.bitis)}`;
  return TARIH_TUR[t.tur] || t.tur;
}

function bildir(mesaj, tur = 'bilgi', sure = 4000) {
  const simge = { ok: 'tamam', hata: 'hata', uyari: 'uyari', bilgi: 'bilgi' }[tur] || 'bilgi';
  const el = h('div', { class: `toast toast-${tur}`, role: tur === 'hata' ? 'alert' : 'status' },
    ikon(simge), h('div', { class: 'toast-metin', text: mesaj }),
    h('button', { class: 'ikon-dugme', type: 'button', 'aria-label': 'Kapat', onclick: () => kapat() }, ikon('kapat', 14)));
  const kapat = () => { el.classList.remove('acik'); setTimeout(() => el.remove(), 200); };
  $('#toastlar').append(el);
  requestAnimationFrame(() => el.classList.add('acik'));
  if (sure) setTimeout(kapat, tur === 'hata' ? Math.max(sure, 7000) : sure);
}

function odakHapsi(kap) {
  kap.addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;
    const ogeler = [...kap.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
      .filter(el => !el.disabled && el.offsetParent !== null);
    if (!ogeler.length) return;
    const ilk = ogeler[0], son = ogeler[ogeler.length - 1];
    if (e.shiftKey && document.activeElement === ilk) { e.preventDefault(); son.focus(); }
    else if (!e.shiftKey && document.activeElement === son) { e.preventDefault(); ilk.focus(); }
  });
}

function onayla({ baslik, metin, eylem = 'Onayla', tehlike = false }) {
  return new Promise(coz => {
    const kok = $('#modal-kok'), onceki = document.activeElement;
    const kapat = sonuc => { kok.replaceChildren(); document.removeEventListener('keydown', tus, true); if (onceki) onceki.focus(); coz(sonuc); };
    const tus = e => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); kapat(false); } };
    const evet = h('button', { class: `btn ${tehlike ? 'btn-tehlike' : 'btn-ana'}`, type: 'button', onclick: () => kapat(true) }, eylem);
    const modal = h('div', { class: 'modal', role: 'alertdialog', 'aria-modal': 'true', 'aria-labelledby': 'modal-baslik' },
      h('h2', { id: 'modal-baslik', text: baslik }), h('p', { text: metin }),
      h('div', { class: 'eylemler' }, h('button', { class: 'btn', type: 'button', onclick: () => kapat(false) }, 'Vazgeç'), evet));
    kok.replaceChildren(h('div', { class: 'modal-kok', onclick: e => { if (e.target === e.currentTarget) kapat(false); } }, modal));
    document.addEventListener('keydown', tus, true);
    odakHapsi(modal);
    evet.focus();
  });
}

let cekmece = null;
function cekmeceAc({ baslik, altBaslik, govde, altlik, kapanmadanOnce }) {
  cekmeceKapat(true);
  const onceki = document.activeElement;
  const panel = h('section', { class: 'cekmece', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'cekmece-baslik' },
    h('header', { class: 'cekmece-ust' },
      h('div', {}, h('h2', { id: 'cekmece-baslik', text: baslik }), altBaslik ? h('p', { class: 'ikincil', text: altBaslik }) : null),
      h('button', { class: 'ikon-dugme', type: 'button', 'aria-label': 'Kapat', onclick: () => cekmeceKapat() }, ikon('kapat'))),
    h('div', { class: 'cekmece-govde' }, govde),
    altlik ? h('footer', { class: 'cekmece-alt' }, altlik) : null);
  const perde = h('div', { class: 'perde', onclick: () => cekmeceKapat() });
  $('#cekmece-kok').replaceChildren(perde, panel);
  requestAnimationFrame(() => { perde.classList.add('acik'); panel.classList.add('acik'); });
  cekmece = { panel, perde, onceki, kapanmadanOnce };
  odakHapsi(panel);
  setTimeout(() => { const ilk = panel.querySelector('[data-ilk]') || panel.querySelector('input, button'); if (ilk) ilk.focus(); }, 60);
}
async function cekmeceKapat(zorla = false) {
  if (!cekmece) return;
  if (!zorla && cekmece.kapanmadanOnce && !(await cekmece.kapanmadanOnce())) return;
  const { panel, perde, onceki } = cekmece;
  cekmece = null;
  panel.classList.remove('acik'); perde.classList.remove('acik');
  setTimeout(() => { panel.remove(); perde.remove(); }, 220);
  if (onceki && document.contains(onceki)) onceki.focus();
}

function segmentli({ secenekler, deger, onDegis, etiket }) {
  const kok = h('div', { class: 'segment', role: 'radiogroup', 'aria-label': etiket });
  const ciz = () => kok.replaceChildren(...secenekler.map(s => h('button', {
    type: 'button', role: 'radio', 'aria-checked': String(s.deger === deger), class: 'segment-oge' + (s.deger === deger ? ' secili' : ''),
    tabIndex: s.deger === deger ? 0 : -1, disabled: s.devreDisi || false, title: s.ipucu || null, 'data-deger': s.deger,
    onclick: () => { if (deger === s.deger) return; deger = s.deger; ciz(); onDegis && onDegis(deger); kok.querySelector('.secili').focus(); },
  }, s.ikon ? ikon(s.ikon, 14) : null, s.etiket)));
  kok.addEventListener('keydown', e => {
    if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
    const acik = secenekler.filter(s => !s.devreDisi);
    const i = acik.findIndex(s => s.deger === deger);
    const yeni = acik[(i + (e.key === 'ArrowRight' ? 1 : -1) + acik.length) % acik.length];
    if (yeni) { e.preventDefault(); deger = yeni.deger; ciz(); onDegis && onDegis(deger); kok.querySelector('.secili').focus(); }
  });
  ciz();
  return { el: kok, deger: () => deger, ayarla: v => { deger = v; ciz(); } };
}

function cokluSecim({ etiket, secenekler, secili = [], maks = 10, tek = false, yerTutucu = 'Ara ve seç…', onDegis }) {
  const id = `cs${++csSayac}`;
  let acik = false, aktif = 0, sorgu = '', tum = secenekler || [];
  const secim = [...secili];
  const kutu = h('div', { class: 'cs' });
  const cipler = h('div', { class: 'cs-cipler' });
  const giris = h('input', { class: 'cs-giris', id, role: 'combobox', 'aria-expanded': 'false', 'aria-controls': `${id}-liste`,
    'aria-autocomplete': 'list', 'aria-label': etiket, autocomplete: 'off', spellcheck: 'false' });
  const liste = h('div', { class: 'cs-liste', id: `${id}-liste`, role: 'listbox', 'aria-label': etiket, 'aria-multiselectable': tek ? null : 'true', hidden: true });
  kutu.append(h('div', { class: 'cs-alan', onclick: () => giris.focus() }, cipler, giris), liste);
  const bul = api => tum.find(s => s.api === api) || { api, ad: api };
  /** Arama sırası: ad başı > kelime başı > içinde geçen (GA4 rapor adı, Keşfet adı, diğer adlar, İngilizce ad, API adı). Aramasız: kategoriye göre. */
  const puan = (s, q) => {
    if (norm(s.ad).startsWith(q)) return 0;  // GA4 rapor adı önce
    const adlar = [s.ad, s.kesfet, ...(s.diger || []), s.en, s.api].filter(Boolean).map(norm);
    if (adlar.some(a => a.startsWith(q))) return 1;
    if (adlar.some(a => a.split(/[\s/_-]+|(?=[A-Z])/).some(k => k.startsWith(q)))) return 2;
    return adlar.some(a => a.includes(q)) ? 3 : -1;
  };
  const filtreli = () => {
    const q = norm(sorgu);

function menuGoster(dayanak, ogeler) {
  return new Promise(coz => {
    const kok = $('#modal-kok'), r = dayanak.getBoundingClientRect();
    const kapat = () => { kok.replaceChildren(); document.removeEventListener('keydown', tus, true); dayanak.focus(); coz(); };
    const tus = e => {
      const dug = [...menu.querySelectorAll('button')], i = dug.indexOf(document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); kapat(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); dug[(i + 1) % dug.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); dug[(i - 1 + dug.length) % dug.length].focus(); }
    };
    const menu = h('div', { class: 'cs-liste', role: 'menu', style: `position:fixed;left:auto;right:${Math.max(8, innerWidth - r.right)}px;top:${r.bottom + 4}px;width:180px` },
      ogeler.map(o => h('button', { class: 'cs-secenek', role: 'menuitem', type: 'button', style: `width:100%;border:0;background:transparent;${o.tehlike ? 'color:var(--err-text)' : ''}`,
        onclick: () => { kapat(); o.eylem(); }, onmouseenter: e => e.currentTarget.focus() }, ikon(o.ikon, 15), h('span', { class: 'cs-ad', text: o.ad }))));
    kok.replaceChildren(h('div', { style: 'position:fixed;inset:0;z-index:60', onclick: e => { if (e.target === e.currentTarget) kapat(); } }, menu));
    document.addEventListener('keydown', tus, true);
    menu.querySelector('button').focus();
  });
}

const HAZIR_TARIH = [['dun', { tur: 'dun' }, 'Dün'], ['g7', { tur: 'son_n_gun', n: 7 }, 'Son 7 gün'], ['g28', { tur: 'son_n_gun', n: 28 }, 'Son 28 gün (GA4 varsayılanı)'],

function hazirRaporlarAc() {
  const kaynak = varsayilanKaynak();
  const secim = new Map();      // paket kimliği -> Set(rapor kimliği)
  const boyutSecim = {};        // rapor kimliği -> seçilen ana kırılım
  let agac = null, metaHatasi = null, tarihKod = 'g28', etkin = true;
  const govde = h('div');
  const bilgi = h('div', { class: 'dogrulama' });
  const dugme = h('button', { class: 'btn btn-ana', type: 'button', onclick: () => cek() });
  const tarihSec = h('select', { class: 'giris', style: 'height:32px;width:auto', 'aria-label': 'Çekilen raporların tarihi', onchange: e => { tarihKod = e.target.value; } },

  const etkinAnahtar = anahtarDugme({ checked: etkin, metin: 'Etkin', etiket: 'Çekilen raporlar etkin olsun', onDegis: v => { etkin = v; } });

  async function agacYukle() {
    try {
      const r = await api('GET', `/api/hazir-raporlar?kaynak=${kaynak}`);
      agac = r.agac; metaHatasi = r.meta_hatasi; D.paketler = r.paketler;
    } catch (e) { agac = []; metaHatasi = e.message; }
    ciz();
  }

  // ----- kütüphane -----
  const seciliSayi = () => [...secim.values()].reduce((n, s) => n + s.size, 0);
  function raporSatiri(p, r, sec) {
    const kapali = Boolean(r.desteklenmiyor || r.projede);
    const kutu = h('input', { type: 'checkbox', checked: r.projede || sec.has(r.kimlik), disabled: kapali, 'data-odak': `r:${p.kimlik}:${r.kimlik}`,
      onchange: e => { const s = secim.get(p.kimlik) || new Set(); if (e.target.checked) s.add(r.kimlik); else s.delete(r.kimlik); secim.set(p.kimlik, s); ciz(); } });
    const adlarR = a => r.adlar[a] || a;
    const ayrinti = r.desteklenmiyor ? r.desteklenmiyor
      : [`Kırılım: ${r.boyutlar.map(adlarR).join(', ') || 'yok'}`, ` · Metrikler: ${r.metrikler.map(adlarR).join(', ')}`,
         r.filtreler.length ? ` · Filtre: ${r.filtreler.map(f => `${adlarR(f.alan)} = ${f.deger}`).join(', ')}` : '', r.aciklama ? ` · ${r.aciklama}` : ''].join('');
    return h('div', { class: 'rapor-satir' + (kapali ? ' soluk-satir' : '') },
      h('label', { class: 'rapor-ust' }, kutu, h('span', { class: 'rapor-ad', text: r.ad }),
        r.desteklenmiyor ? h('span', { class: 'rozet', text: 'desteklenmiyor' }) : r.projede ? h('span', { class: 'rozet rozet-ok', text: 'projede' }) : null,
        r.eksik.length ? h('span', { class: 'rozet rozet-uyari', title: r.eksik.map(adlarR).join(', '), text: `${r.eksik.length} alan bu mülkte yok` }) : null),
      h('div', { class: 'ipucu', text: ayrinti }),
      !kapali && r.secenekler.length ? h('label', { class: 'rapor-boyut' }, 'Ana kırılım',
        h('select', { class: 'giris', style: 'height:28px;width:auto', 'aria-label': `${r.ad} ana kırılımı`, onchange: e => { boyutSecim[r.kimlik] = e.target.value; } },
          r.secenekler.map(b => h('option', { value: b, text: adlarR(b), selected: (boyutSecim[r.kimlik] || r.boyutlar[0]) === b ? true : null })))) : null);
  }
  function paketKutusu(p) {
    const uygun = p.raporlar.filter(r => !r.desteklenmiyor && !r.projede);
    const sec = secim.get(p.kimlik) || new Set();
    const hepsi = uygun.length > 0 && uygun.every(r => sec.has(r.kimlik));
    const projede = p.raporlar.filter(r => r.projede).length, cekilebilir = p.raporlar.filter(r => !r.desteklenmiyor).length;
    const kutu = h('input', { type: 'checkbox', checked: hepsi || (!uygun.length && projede > 0), disabled: !uygun.length, 'aria-label': `${p.tam_ad} grubunun tamamı`,
      'data-odak': `p:${p.kimlik}`, onchange: e => { secim.set(p.kimlik, new Set(e.target.checked ? uygun.map(r => r.kimlik) : [])); ciz(); } });

    return h('div', { class: 'paket-kutu' },

    const koleksiyonlar = [...new Set(agac.map(p => p.koleksiyon))];
    return [
      h('p', { class: 'ipucu', style: 'margin-bottom:12px', text: 'GA4\'te sol menüdeki Raporlar gibi gruplanmıştır. Bir grubu işaretlersen içindeki raporların her biri ayrı iş olur ve İşler\'de bu grubun altında durur; uygulamanın kütüphanesine bu gruba yeni rapor eklenince projene kendiliğinden gelir. Sayılar GA4 standart raporuna yakın kopyadır; mülkünde özelleştirilmiş bir raporu birebir almak için işi elle kurarsın.' }),

    if (!sec.length) return;
    yukleniyorYap(dugme, 'Çekiliyor…');
    try {
      const tarih = HAZIR_TARIH.find(([k]) => k === tarihKod)[1];
      const r = await api('POST', '/api/paketler/cek', { secim: sec, tarih, etkin, eksik_onay: eksikOnay, kaynak });

        return;

      bildir(`${r.eklenen.length} rapor iş olarak eklendi${r.zaten.length ? `, ${r.zaten.length} zaten projedeydi` : ''}${r.atlanan.length ? `, ${r.atlanan.length} atlandı` : ''}.`, r.eklenen.length ? 'ok' : 'uyari', 6000);
      await durumYenile();
      await cekmeceKapat(true);

function formModal({ baslik, aciklama, alanlar, eylem = 'Kaydet' }) {
  return new Promise(coz => {
    const kok = $('#modal-kok'), onceki = document.activeElement;
    const tus = e => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); kapat(null); } };
    const kapat = v => { kok.replaceChildren(); document.removeEventListener('keydown', tus, true); if (onceki && document.contains(onceki)) onceki.focus(); coz(v); };
    const girisler = alanlar.map(a => h(a.cok ? 'textarea' : 'input', { class: 'giris', id: `fm-${a.ad}`, value: a.deger || '', maxLength: a.max || 100,
      placeholder: a.yerTutucu || '', rows: a.cok ? 2 : null }));
    const form = h('form', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'modal-baslik', onsubmit: e => {
      e.preventDefault();
      const v = {};
      alanlar.forEach((a, i) => { v[a.ad] = girisler[i].value.trim(); });
      const eksik = alanlar.findIndex(a => a.zorunlu && !v[a.ad]);
      if (eksik >= 0) { girisler[eksik].focus(); return bildir(`${alanlar[eksik].etiket} boş olamaz.`, 'uyari'); }
      kapat(v);
    } },
      h('h2', { id: 'modal-baslik', text: baslik }), aciklama ? h('p', { text: aciklama }) : null,
      ...alanlar.map((a, i) => h('div', { class: 'alan', style: 'margin-top:12px' }, h('label', { class: 'etiket', for: `fm-${a.ad}`, text: a.etiket }), girisler[i])),
      h('div', { class: 'eylemler' }, h('button', { class: 'btn', type: 'button', onclick: () => kapat(null) }, 'Vazgeç'), h('button', { class: 'btn btn-ana', type: 'submit' }, eylem)));
    kok.replaceChildren(h('div', { class: 'modal-kok', onclick: e => { if (e.target === e.currentTarget) kapat(null); } }, form));
    document.addEventListener('keydown', tus, true);
    odakHapsi(form);
    girisler[0].focus();
  });
}

    const kapat = v => { kok.replaceChildren(); document.removeEventListener('keydown', tus, true); if (onceki && document.contains(onceki)) onceki.focus(); coz(v); };

    { ad: 'Temayı değiştir', ikon: 'ay', eylem: temaDegistir },
    { ad: 'Yardım', ikon: 'yardim', eylem: () => { location.hash = '#/yardim'; } },
    ...D.isler.map(j => ({ ad: `İşi düzenle: ${j.ad}`, ikon: 'kalem', eylem: () => isDuzenle(j) })),
  ];
  let aktif = 0;
  const kok = $('#modal-kok'), onceki = document.activeElement;
  const giris = h('input', { class: 'palet-giris', placeholder: 'Komut veya iş ara…', 'aria-label': 'Komut ara', role: 'combobox', 'aria-expanded': 'true', 'aria-controls': 'palet-liste' });
  const liste = h('div', { class: 'palet-liste', id: 'palet-liste', role: 'listbox' });
  const filtreli = () => komutlar.filter(k => norm(k.ad).includes(norm(giris.value))).slice(0, 30);
  const kapat = () => { kok.replaceChildren(); if (onceki) onceki.focus(); };
  const calis = k => { kapat(); k.eylem(); };
  function ciz() {
    const f = filtreli();
    aktif = Math.min(aktif, Math.max(0, f.length - 1));
    liste.replaceChildren(...(f.length ? f.map((k, i) => h('div', { class: 'palet-oge' + (i === aktif ? ' aktif' : ''), role: 'option', id: `p${i}`, 'aria-selected': String(i === aktif),
      onmousedown: e => { e.preventDefault(); calis(k); }, onmousemove: () => { if (aktif !== i) { aktif = i; ciz(); } } },
      ikon(k.ikon, 15), h('span', { text: k.ad }), k.kisayol ? h('span', { class: 'kbd', text: k.kisayol }) : null))
      : [h('div', { class: 'cs-bos', text: 'Sonuç yok.' })]));
    giris.setAttribute('aria-activedescendant', f.length ? `p${aktif}` : '');
    const el = liste.querySelector('.aktif'); if (el) el.scrollIntoView({ block: 'nearest' });
  }
  giris.addEventListener('input', () => { aktif = 0; ciz(); });
  giris.addEventListener('keydown', e => {
    const f = filtreli();
    if (e.key === 'ArrowDown') { e.preventDefault(); aktif = Math.min(f.length - 1, aktif + 1); ciz(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); aktif = Math.max(0, aktif - 1); ciz(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (f[aktif]) calis(f[aktif]); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); kapat(); }
  });
  kok.replaceChildren(h('div', { class: 'modal-kok', onclick: e => { if (e.target === e.currentTarget) kapat(); } },
    h('div', { class: 'palet', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Komut paleti' }, h('div', { class: 'palet-ust' }, ikon('ara', 17), giris), liste)));
  ciz(); giris.focus();
}

/* ---------- Tema, gezinme, başlatma ---------- */

function temaOku() { try { return localStorage.getItem('tema'); } catch (e) { return null; } }
function etkinTema() { const t = document.documentElement.dataset.tema; return t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'koyu' : 'acik'); }
function temaDugmesiCiz() { const k = etkinTema() === 'koyu'; $('#tema-dugme').replaceChildren(ikon(k ? 'gunes' : 'ay', 16)); $('#tema-dugme').title = k ? 'Açık temaya geç' : 'Koyu temaya geç'; }
function temaDegistir() {
  const yeni = etkinTema() === 'koyu' ? 'acik' : 'koyu';
  document.documentElement.dataset.tema = yeni;
  try { localStorage.setItem('tema', yeni); } catch (e) { /* depolama kapalı */ }
  temaDugmesiCiz();
}

const SAYFALAR = { genel: ['Genel bakış', 'genel', sayfaGenel], isler: ['İşler', 'isler', sayfaIsler], calistir: ['Çalıştır', 'calistir', sayfaCalistir],
                   zamanlama: ['Sheets ve zamanlama', 'tablo', sayfaZamanlama], projeler: ['Projeler', 'klasor', sayfaProjeler],
                   baglanti: ['Bağlantı', 'baglanti', sayfaBaglanti], yardim: ['Yardım', 'yardim', sayfaYardim] };
function navCiz(aktifAd) {
  const oge = ad => { const [baslik, simge] = SAYFALAR[ad];
    return h('a', { class: 'nav-oge', href: `#/${ad}`, 'aria-current': ad === aktifAd ? 'page' : null }, ikon(simge, 16), h('span', { text: baslik })); };
  $('#nav').replaceChildren(oge('genel'), oge('isler'), oge('calistir'), oge('zamanlama'), h('div', { class: 'nav-baslik', text: 'Ayarlar' }), oge('projeler'), oge('baglanti'), oge('yardim'));
}
function yonlendir() {
  const ad = (location.hash.replace(/^#\//, '').split(/[?/]/)[0]) || 'genel';
  const sayfa = SAYFALAR[ad] || SAYFALAR.genel;
  navCiz(SAYFALAR[ad] ? ad : 'genel');
  D.calistirKisayol = null;
  const eski = D.durum && D.durum.surum !== ARAYUZ_SURUMU ? h('div', { class: 'sayfa', style: 'padding-bottom:0' },
    h('div', { class: 'uyari-kutu uyari', role: 'alert' }, ikon('uyari'), h('div', {}, h('b', { text: 'Uygulama güncellendi ama eski sürüm çalışıyor. ' }),
      `Siyah pencereyi kapatıp AnalyticsVeriCekme.cmd ile yeniden aç (çalışan: v${D.durum.surum}, yeni: v${ARAYUZ_SURUMU}). O zamana kadar yeni özellikler doğru çalışmaz.`))) : null;
  try { $('#icerik').replaceChildren(...(eski ? [eski] : []), sayfa[2]()); }
  catch (e) { $('#icerik').replaceChildren(h('div', { class: 'sayfa' }, h('div', { class: 'uyari-kutu hata' }, ikon('hata'), h('div', { text: `Sayfa çizilemedi: ${e.message}` })))); }
  document.title = `${sayfa[0]} · Analytics Veri Çekme`;
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); paletAc(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && cekmece && cekmece.kaydet && !disariAc()) { e.preventDefault(); cekmece.kaydet(); return; }
  if (e.key === 'Escape' && cekmece && !disariAc()) { cekmeceKapat(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && D.calistirKisayol && !cekmece) { e.preventDefault(); D.calistirKisayol(); return; }
  if (!yazmada() && !cekmece && !disariAc() && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.toLowerCase() === 'n') { e.preventDefault(); isDuzenle(null); }
});

(async function basla() {
  const t = temaOku();
  if (t === 'acik' || t === 'koyu') document.documentElement.dataset.tema = t;
  temaDugmesiCiz();
  $('#tema-dugme').addEventListener('click', temaDegistir);
  $('#palet-dugme').addEventListener('click', paletAc);
  navCiz('genel');
  try { D.proje = localStorage.getItem('proje'); } catch (e) { D.proje = null; }
  $('#icerik').replaceChildren(h('div', { class: 'sayfa' }, h('div', { class: 'izgara izgara-3' }, [1, 2, 3].map(() => h('div', { class: 'kart stat' },
    h('span', { class: 'iskelet', style: 'width:40%' }), h('span', { class: 'iskelet', style: 'width:30%;height:24px;margin-top:8px' }))))));
  try {
    await Promise.all([durumYenile(), islerYenile()]);
  } catch (e) {
    $('#icerik').replaceChildren(h('div', { class: 'sayfa' }, h('div', { class: 'uyari-kutu hata' }, ikon('hata'),
      h('div', {}, h('b', { text: 'Uygulamaya ulaşılamadı. ' }), e.message, ' — siyah pencerenin açık olduğundan emin ol ve sayfayı yenile.'))));
    return;
  }
  addEventListener('hashchange', yonlendir);
  yonlendir();
})();
</script>
